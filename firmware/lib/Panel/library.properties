sentence=ST7735 1.8" 128x160 panel on NodeMcu/ESP8266 with bulk-SPI fast paths.
paragraph=Subclasses Adafruit_ST7735 so the full Adafruit_GFX API still works, and overrides the fill/line primitives to push pixels through the ESP8266's 64-byte SPI hardware FIFO instead of Adafruit's per-pixel loop (13% -> 80% of the SPI ceiling). Also provides PROGMEM bitmap blitting and band streaming, which is how you render on a chip with only ~50KB of heap.
